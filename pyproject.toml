[project]
name = "bacnet-scan-tool"
version = "0.1.0rc0"
description = ""
authors = [
    {name = "C. Allwardt",email = "3979063+craig8@users.noreply.github.com"}
]
license = {text = "Apache 2.0"}
readme = "README.md"
requires-python = ">=3.10,<4.0"

[tool.poetry]
packages = [
    {include="bacnet_scan_tool", from="src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115.11,<0.116.0"
pydantic = ">=2.10.6,<3.0.0"
sqlmodel = ">=0.0.8,<1.0.0"
click = ">=8.1.8,<9.0.0"
uvicorn = ">=0.34.0,<0.35.0"
protocol-proxy = { git = "https://github.com/riley206-pnnl/lib-protocol-proxy-fixed.git", rev = "bus_adapter_changes" }
protocol-proxy-bacnet = { git = "https://github.com/riley206-pnnl/lib-protocol-proxy-bacnet-fixed.git", rev = "merge_of_rileys_code_and_latest_changes" }
bacpypes3 = "^0.0.102"
psutil = "^7.0.0"
gevent = "^25.5.1"
python-multipart = "^0.0.20"
netifaces = "^0.11.0"
bac0 = "^2025.6.10"
rdflib = "^6.0"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
